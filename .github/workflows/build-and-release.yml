name: Build and Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore Tetris.sln

      - name: Build
        run: dotnet build Tetris.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Tetris/Tetris.csproj --configuration Release --output ./publish --no-build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tetris-Release
          path: ./publish/**/*

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Tetris-Release
          path: ./release

      - name: Create Release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path ./release/* -DestinationPath Tetris-Release.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: Tetris-Release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
